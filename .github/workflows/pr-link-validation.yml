name: "Docs: Antora Link Validation"

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - '**/*.adoc'
      - 'ss-local-playbook.yml'
      - 'Makefile'

jobs:
  validate-internal-links:
    name: Run Antora Build & Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: make environment

      - name: Exclude Translated Modules
        run: |
          echo "Removing non-English modules to prevent translation link failures..."
          rm -rf docs/latest/modules/{de,es,fr,ja,pt,zh}

          echo "Removing non-English nav entries from antora.yml..."
          sed -i -e '/modules\/de/d' -e '/modules\/es/d' -e '/modules\/fr/d' -e '/modules\/ja/d' -e '/modules\/pt/d' -e '/modules\/zh/d' docs/latest/antora.yml

      - name: Check for Orphan Pages
        run: python3 scripts/antora-nav-orphans-checker.py -antoraPath docs/latest -module en -filename modules/en/nav.adoc
        
      - name: Enforce AsciiDoc Link Style
        run: python3 scripts/link-syntax-checker.py docs/
        
      - name: Verify Documentation Links
        run: make ci-pr-link-check
